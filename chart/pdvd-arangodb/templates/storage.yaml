{{- if contains "eks" (.Capabilities.KubeVersion.GitVersion | toString) }}
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: pdvd-sc
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  fsType: ext4
  encrypted: "true"
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer

{{- else if contains "gke" (.Capabilities.KubeVersion.GitVersion | toString) }}
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: pdvd-sc
provisioner: pd.csi.storage.gke.io
parameters:
  type: pd-standard
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer

{{- else }}
# Fallback: no StorageClass created — ensure pdvd-sc exists in your cluster
{{- end }}